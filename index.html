  :root {
    --red: #e30613;
    --blue: #0081ff;
    --digit: #fff;
    --board-ratio: 1.5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Noto Sans JP", sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .board-wrap {
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .scoreboard {
    width: min(100vw, calc(100dvh * var(--board-ratio)));
    height: min(100dvh, calc(100vw / var(--board-ratio)));
    background: #000;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* タイマー - 上下余白を狭く */
  .timer-area {
    flex: 0 0 auto;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.2vh 0;
    border-bottom: 10px solid #000;
    min-height: 0;
  }
  .timer {
    font-family: 'DSEG7-Classic', monospace;
    font-weight: 700;
    font-size: min(40vh, 36vw, 380px);
    line-height: 1;
    color: var(--digit);
    letter-spacing: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    width: auto;
  }
  #timerMin { text-align: center; }
  #timerSec { text-align: center; }
  .timer .colon { text-align: center; min-width: 0.3em; margin: 0 0.02em; }
  /* スコア - 残り全体を埋めて下部余白を消す */
  .scores {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    background: #000;
    min-height: 0;
  }
  .team {
    display: flex;
    flex-direction: column;
    padding: 18px;
    min-height: 0;
  }
  .team.red { background: var(--red); }
  .team.blue { background: var(--blue); }
  .team-inner-black {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-height: 0;
    padding: 1vh 0;
  }
  .score {
    font-family: "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: min(36vh, 35vw, 342px);
    line-height: 1;
    color: #fff;
    text-align: center;
    white-space: nowrap;
    transform: scaleY(1.1);
    transform-origin: center;
    display: inline-block;
  }
  .team-name {
    text-align: center;
    font-size: min(4.2vh, 3.5vw, 36px);
    font-weight: 900;
    padding: 1.2vh 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @media (max-width: 600px) {
    .timer { font-size: min(22vh, 28vw, 160px); }
    .score { font-size: min(14vh, 18vw, 90px); }
  }
  .board-wrap:fullscreen { background: #000; }
  .board-wrap:fullscreen .scoreboard {
    width: min(100vw, calc(100dvh * var(--board-ratio)));
    height: min(100dvh, calc(100vw / var(--board-ratio)));
  }
  #hint {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: #fff; font-size: 11px;
    padding: 4px 10px; border-radius: 100px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
</style>
</head>
<body>
  <div class="board-wrap" id="boardWrap">
    <div class="scoreboard">
      <div class="timer-area">
        <div class="timer" id="timerDisplay"><span id="timerMin">3</span><span class="colon">:</span><span id="timerSec">00</span></div>
      </div>
      <div class="scores">
        <div class="team red">
          <div class="team-inner-black"><div class="score" id="scoreRed">0</div></div>
          <div class="team-name" id="nameRed">チームA</div>
        </div>
        <div class="team blue">
          <div class="team-inner-black"><div class="score" id="scoreBlue">0</div></div>
          <div class="team-name" id="nameBlue">チームB</div>
        </div>
      </div>
    </div>
  </div>
  <div id="hint">control.htmlで操作 | F:全画面</div>
<script>
const $ = s=>document.getElementById(s);
const timerMinEl=$('timerMin'), timerSecEl=$('timerSec'), scoreRedEl=$('scoreRed'), scoreBlueEl=$('scoreBlue'), nameRedEl=$('nameRed'), nameBlueEl=$('nameBlue'), boardWrap=$('boardWrap'), hintEl=$('hint');
const STORAGE_KEY='scoreboard-state-v2', CHANNEL_NAME='scoreboard';
let initialSeconds=3*60, remaining=3*60, isRunning=false, scores={red:0,blue:0}, names={red:"チームA",blue:"チームB"}, timerId=null;
let bc=null; try{ bc=new BroadcastChannel(CHANNEL_NAME);}catch{}
function fmt(s){ const m=Math.floor(s/60), sec=s%60; return {m:String(m), s:String(sec).padStart(2,'0')} }
function renderTimer(){ const {m,s}=fmt(remaining); timerMinEl.textContent=m; timerSecEl.textContent=s; }
function renderScores(){
  scoreRedEl.textContent=scores.red; scoreBlueEl.textContent=scores.blue; nameRedEl.textContent=names.red||'RED'; nameBlueEl.textContent=names.blue||'BLUE';
  // 4桁のみ自動縮小、3桁以下はCSSの固定サイズを維持
  [[scoreRedEl, scores.red],[scoreBlueEl, scores.blue]].forEach(([el,v])=>{
    const len=String(v).length;
    if(len>=4) el.style.fontSize='min(22vh,16vw,200px)';
    else el.style.fontSize='';
  });
}
function renderAll(){ renderTimer(); renderScores(); }
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({initialSeconds,remaining,isRunning,scores,names})); }catch{} }
function load(){ try{ const r=localStorage.getItem(STORAGE_KEY); if(r){ const s=JSON.parse(r); // タイマー3:00固定
if(s.names)names=s.names; if(s.scores)scores=s.scores; if(s.remaining!==undefined && s.initialSeconds===180) remaining=s.remaining; else remaining=180; initialSeconds=180; if(s.isRunning!==undefined)isRunning=s.isRunning; } }catch{} }
function broadcastTick(){ const m={type:'tick',remaining,isRunning}; if(bc)try{bc.postMessage(m)}catch{}; try{localStorage.setItem(STORAGE_KEY, JSON.stringify({initialSeconds,remaining,isRunning,scores,names}))}catch{}; if(window.opener)try{window.opener.postMessage(m,'*')}catch{} }
let audioCtx; function beep(){ try{ if(!audioCtx)audioCtx=new(window.AudioContext||window.webkitAudioContext)(); const o=audioCtx.createOscillator(),g=audioCtx.createGain(); o.type='square';o.frequency.value=880;o.connect(g);g.connect(audioCtx.destination);g.gain.setValueAtTime(0.3,audioCtx.currentTime);g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.3);o.start();o.stop(audioCtx.currentTime+0.3);}catch{} }
function tick(){ if(remaining<=0){stop();remaining=0;renderTimer();beep();broadcastTick();return} remaining--; renderTimer(); broadcastTick(); if(remaining<=0){stop();beep();setTimeout(beep,400);setTimeout(beep,800);save();} }
function start(){ if(isRunning||remaining<=0)return; isRunning=true; timerId=setInterval(tick,1000); save(); broadcastTick(); }
function stop(){ if(timerId)clearInterval(timerId); timerId=null; isRunning=false; save(); broadcastTick(); }
function reset(){ stop(); remaining=initialSeconds; renderTimer(); save(); broadcastTick(); }
function setTime(m,s){ const mm=Math.max(0,Math.min(99,m)), ss=Math.max(0,Math.min(59,s)); initialSeconds=mm*60+ss; remaining=initialSeconds; isRunning=false; if(timerId)clearInterval(timerId); timerId=null; renderTimer(); save(); broadcastTick(); }
function applyState(s){ if(s.initialSeconds!==undefined)initialSeconds=s.initialSeconds; if(s.remaining!==undefined)remaining=s.remaining; if(s.isRunning!==undefined){ if(s.isRunning&&!isRunning){isRunning=true; if(!timerId)timerId=setInterval(tick,1000);} else if(!s.isRunning&&isRunning){isRunning=false; if(timerId)clearInterval(timerId); timerId=null;} else isRunning=s.isRunning; } if(s.scores)scores=s.scores; if(s.names)names=s.names; renderAll(); }
if(bc) bc.onmessage=e=>{ const m=e.data; if(!m||!m.type)return; if(m.type==='state'&&m.state)applyState(m.state); else if(m.type==='cmd'){ if(m.action==='start')start(); else if(m.action==='pause')stop(); else if(m.action==='reset')reset(); else if(m.action==='setTime')setTime(Math.floor((m.initialSeconds||0)/60),(m.initialSeconds||0)%60); else if(m.action==='fullscreen')boardWrap.requestFullscreen?.(); } };
window.addEventListener('message',e=>{ const m=e.data; if(!m||!m.type)return; if(m.type==='state'&&m.state)applyState(m.state); else if(m.type==='cmd'){ if(m.action==='start')start(); else if(m.action==='pause')stop(); else if(m.action==='reset')reset(); else if(m.action==='setTime')setTime(Math.floor((m.initialSeconds||0)/60),(m.initialSeconds||0)%60); else if(m.action==='fullscreen')boardWrap.requestFullscreen?.(); } });
window.addEventListener('storage',e=>{ if(e.key===STORAGE_KEY&&e.newValue){ try{applyState(JSON.parse(e.newValue))}catch{} } });
document.addEventListener('keydown',e=>{ if(e.key.toLowerCase()==='f'){ if(!document.fullscreenElement)boardWrap.requestFullscreen?.(); else document.exitFullscreen?.(); } });
boardWrap.addEventListener('dblclick',()=>{ if(!document.fullscreenElement)boardWrap.requestFullscreen?.(); else document.exitFullscreen?.(); });
function showHint(){ hintEl.style.opacity='1'; setTimeout(()=>hintEl.style.opacity='0',2500); }
setTimeout(showHint,600);
load(); renderAll(); if(isRunning) timerId=setInterval(tick,1000);
setTimeout(()=>{ const m={type:'display-ready'}; if(bc)try{bc.postMessage(m)}catch{}; if(window.opener)try{window.opener.postMessage(m,'*')}catch{} },300);
</script>
</body>
</html>
