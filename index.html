  :root {
    --red: #e30613;
    --blue: #0081ff;
    --digit: #fff;
    --board-ratio: 1.5;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  html, body { height: 100%; }
  body {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: "Noto Sans JP", sans-serif;
    color: #fff;
    overflow: hidden;
  }
  .board-wrap {
    width: 100vw;
    height: 100dvh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: #000;
  }
  .scoreboard {
    width: min(100vw, calc(100dvh * var(--board-ratio)));
    height: min(100dvh, calc(100vw / var(--board-ratio)));
    background: #000;
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* タイマー - 上下余白を狭く */
  .timer-area {
    flex: 0 0 auto;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 1.2vh 0;
    border-bottom: 10px solid #000;
    min-height: 0;
  }
  .timer {
    font-family: 'DSEG7-Classic', monospace;
    font-weight: 700;
    font-size: min(40vh, 36vw, 380px);
    line-height: 1;
    color: var(--digit);
    letter-spacing: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    width: auto;
  }
  #timerMin { text-align: center; }
  #timerSec { text-align: center; }
  .timer .colon { text-align: center; min-width: 0.3em; margin: 0 0.02em; }
  .timer.warning { color: #ffe600; }
  .timer.finished { color: #ff3b3b; }
  /* スコア - 残り全体を埋めて下部余白を消す */
  .scores {
    flex: 1;
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
    background: #000;
    min-height: 0;
  }
  .team {
    display: flex;
    flex-direction: column;
    padding: 18px;
    min-height: 0;
  }
  .team.red { background: var(--red); }
  .team.blue { background: var(--blue); }
  .team-inner-black {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    flex: 1;
    min-height: 0;
    padding: 1vh 0;
  }
  .score {
    font-family: "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: min(36vh, 35vw, 342px);
    line-height: 1;
    color: #fff;
    text-align: center;
    white-space: nowrap;
    transform: scaleY(1.1);
    transform-origin: center;
    display: inline-block;
  }
  .team-name {
    text-align: center;
    font-size: min(6vh, 5vw, 52px);
    font-weight: 900;
    padding: 1.5vh 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  @media (max-width: 600px) {
    .timer { font-size: min(22vh, 28vw, 160px); }
    .score { font-size: min(14vh, 18vw, 90px); }
  }
  .board-wrap:fullscreen { background: #000; }
  .board-wrap:fullscreen .scoreboard {
    width: min(100vw, calc(100dvh * var(--board-ratio)));
    height: min(100dvh, calc(100vw / var(--board-ratio)));
  }
  /* カウントダウンオーバーレイ */
  .countdown-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 20;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .countdown-overlay.active { opacity: 1; pointer-events: auto; }
  .countdown-text {
    font-family: 'DSEG14-Classic', 'DSEG7-Classic', monospace;
    font-weight: 400;
    font-size: min(28vh, 32vw, 320px);
    color: #fff;
    text-align: center;
  }
  .countdown-text.number {
    font-family: 'DSEG7-Classic', monospace;
    font-weight: 700;
    font-size: min(40vh, 36vw, 420px);
  }

  #hint {
    position: fixed; bottom: 10px; left: 50%; transform: translateX(-50%);
    background: rgba(0,0,0,0.7); color: #fff; font-size: 11px;
    padding: 4px 10px; border-radius: 100px; opacity: 0; transition: opacity 0.3s; pointer-events: none;
  }
</style>

<body>
  <div class="board-wrap" id="boardWrap">
    <div class="scoreboard">
      <div class="timer-area">
        <div class="timer" id="timerDisplay"><span id="timerMin">0</span><span class="colon">:</span><span id="timerSec">00</span></div>
      </div>

        <div class="team red">
          <div class="team-inner-black"><div class="score" id="scoreRed">0</div></div>
          <div class="team-name" id="nameRed">チームA</div>
        </div>
        <div class="team blue">
          <div class="team-inner-black"><div class="score" id="scoreBlue">0</div></div>
          <div class="team-name" id="nameBlue">チームB</div>
        </div>
      </div>
    </div>
  </div>
    <div id="countdownOverlay" class="countdown-overlay"><div id="countdownText" class="countdown-text"></div></div>
  <audio id="countdownSound" src="sounds/countdown.mp3" preload="auto"></audio>
  <audio id="buzzerSound" src="sounds/buzzer.mp3" preload="auto"></audio>

<script src="https://unpkg.com/mqtt/dist/mqtt.min.js"></script>
<script>
const $ = s=>document.getElementById(s);
const timerMinEl=$('timerMin'), timerSecEl=$('timerSec'), scoreRedEl=$('scoreRed'), scoreBlueEl=$('scoreBlue'), nameRedEl=$('nameRed'), nameBlueEl=$('nameBlue'), boardWrap=$('boardWrap'), hintEl=$('hint'), countdownOverlay=$('countdownOverlay'), countdownText=$('countdownText');
const STORAGE_KEY='scoreboard-state-v2', CHANNEL_NAME='scoreboard';
// テスト用: 何秒から始めるか (0=0:00, 60=1:00, 177=2:57, 0で通常)
const TEST_START_SECONDS = 0;
let totalSeconds=3*60, remaining=TEST_START_SECONDS, isRunning=false, scores={red:0,blue:0}, names={red:"チームA",blue:"チームB"}, timerId=null;
let bc=null; try{ bc=new BroadcastChannel(CHANNEL_NAME);}catch{}
// --- cross-device sync via public MQTT (room separated) ---
const _qp = new URLSearchParams(location.search);
let ROOM_ID = _qp.get('room') || 'default';
let MQTT_TOPIC = 'robocon-score-board/' + ROOM_ID + '/sync';
const CLIENT_ID = 'd-' + Math.random().toString(36).slice(2,9);
let mqttClient = null;
function mqttPublish(m){ try{ if(mqttClient && mqttClient.connected){ m._from=CLIENT_ID; mqttClient.publish(MQTT_TOPIC, JSON.stringify(m)); } }catch{} }
function mqttHandle(m){
  if(!m||!m.type) return;
  if(m._from===CLIENT_ID) return;
  if(m.type==='state'&&m.state)applyState(m.state);
  else if(m.type==='cmd'){ if(m.action==='start')start(); else if(m.action==='pause')stop(); else if(m.action==='reset')reset(); else if(m.action==='setTime')setTime(Math.floor((m.initialSeconds||0)/60),(m.initialSeconds||0)%60); else if(m.action==='fullscreen')boardWrap.requestFullscreen?.(); }
}
const MQTT_BROKERS = [
  'wss://mqtt.eclipseprojects.io:443/mqtt',
  'wss://broker.emqx.io:8084/mqtt',
  'wss://broker.hivemq.com:8884/mqtt',
  'wss://test.mosquitto.org:8081/mqtt'
];
const MQTT_LIB_FALLBACK = 'https://cdn.jsdelivr.net/npm/mqtt/dist/mqtt.min.js';
let mqttBrokerIdx = 0, mqttEverConnected = false, mqttGen = 0, mqttStateText = '○切断';
function mqttInit(){
  if(typeof mqtt==='undefined'){
    updateMqttHint(); mqttStateText='○ライブラリ再読込中…'; updateMqttHint();
    const sc = document.createElement('script');
    sc.src = MQTT_LIB_FALLBACK;
    sc.onload = ()=>mqttInit();
    sc.onerror = ()=>{ mqttStateText='○CDN読込失敗(ネット接続を確認)'; updateMqttHint(); };
    document.head.appendChild(sc);
    return;
  }
  const gen = ++mqttGen;
  try{
    if(mqttClient) try{ mqttClient.end(true); }catch{}
    MQTT_TOPIC = 'robocon-score-board/' + ROOM_ID + '/sync';
    const url = MQTT_BROKERS[mqttBrokerIdx % MQTT_BROKERS.length];
    let host = url; try{ host = url.split('/')[2]; }catch{}
    mqttStateText='○接続試行中…(' + host + ')'; updateMqttHint();
    mqttClient = mqtt.connect(url, { reconnectPeriod: 2000, connectTimeout: 8000, clientId: CLIENT_ID });
    mqttClient.on('connect', ()=>{ if(gen!==mqttGen) return; mqttEverConnected=true; try{ mqttClient.subscribe(MQTT_TOPIC); }catch{} mqttStateText='●接続中(' + host + ')'; updateMqttHint(); });
    const fail = ()=>{
      if(gen!==mqttGen) return;
      if(mqttEverConnected){ mqttStateText='○切断(再接続中…)'; updateMqttHint(); return; }
      mqttBrokerIdx++;
      mqttStateText='○次ブローカー試行中…'; updateMqttHint();
      setTimeout(()=>{ if(gen===mqttGen) mqttInit(); }, 1500);
    };
    mqttClient.on('error', (e)=>{ console.log('[mqtt] error', e && e.message); fail(); });
    mqttClient.on('close', ()=>{ if(gen!==mqttGen) return; if(mqttEverConnected){ mqttStateText='○切断(再接続中…)'; updateMqttHint(); } else fail(); });
    mqttClient.on('reconnect', ()=>{ if(gen===mqttGen){ mqttStateText='○再接続中…'; updateMqttHint(); } });
    mqttClient.on('message', (t, buf)=>{ try{ mqttHandle(JSON.parse(buf.toString())); }catch{} });
  }catch(e){ mqttStateText='○初期化失敗:' + e; updateMqttHint(); }
}
function updateMqttHint(){
  try{
    const base='control.htmlで操作 | F:全画面';
    hintEl.textContent = base + ' | room:' + ROOM_ID + ' ' + mqttStateText;
  }catch{}
}
let isCounting=false;
let countdownIds=[];
let lastCountdownPlay=-1;
function showCountdown(text, isNumber){
  countdownText.textContent=text;
  countdownText.className=isNumber?'countdown-text number':'countdown-text';
  countdownOverlay.classList.add('active');
  const msg={type:'countdown', text, isNumber};
  if(bc) try{bc.postMessage(msg)}catch{}
  if(window.opener) try{window.opener.postMessage(msg,'*')}catch{}
  mqttPublish({type:'countdown', text, isNumber});
}
function hideCountdown(){
  countdownOverlay.classList.remove('active');
  const msg={type:'countdown', hide:true};
  if(bc) try{bc.postMessage(msg)}catch{}
  if(window.opener) try{window.opener.postMessage(msg,'*')}catch{}
  mqttPublish({type:'countdown', hide:true});
}
function clearCountdown(){
  countdownIds.forEach(id=>clearTimeout(id));
  countdownIds=[];
  hideCountdown();
  isCounting=false;
}
function startCountdownSequence(){
  isCounting=true;
  showCountdown('5', true);
  countdownIds.push(setTimeout(()=>{ showCountdown('4', true);
    countdownIds.push(setTimeout(()=>{ showCountdown('3', true);
      playCountdownSound();
      countdownIds.push(setTimeout(()=>{ showCountdown('2', true);
        countdownIds.push(setTimeout(()=>{ showCountdown('1', true);
          countdownIds.push(setTimeout(()=>{
            showCountdown('START', false);
            countdownIds.push(setTimeout(()=>{
              hideCountdown();
              isCounting=false;
              remaining=TEST_START_SECONDS+2;
              renderTimer();
              isRunning=true;
              if(!timerId) timerId=setInterval(tick,1000);
              save(); broadcastTick();
            }, 2000));
          }, 1000));
        }, 1000));
      }, 1000));
    }, 1000));
  }, 1000));
}
function fmt(s){ const m=Math.floor(s/60), sec=s%60; return {m:String(m), s:String(sec).padStart(2,'0')} }
function renderTimer(){
  const {m,s}=fmt(remaining);
  timerMinEl.textContent=m; timerSecEl.textContent=s;
  const el=document.getElementById('timerDisplay');
  el.classList.remove('warning','finished');
  if(remaining>=177 && remaining<=179) el.classList.add('warning');
  else if(remaining>=180) el.classList.add('finished');
}
function renderScores(){
  scoreRedEl.textContent=scores.red; scoreBlueEl.textContent=scores.blue; nameRedEl.textContent=names.red||'RED'; nameBlueEl.textContent=names.blue||'BLUE';
  [[scoreRedEl, scores.red],[scoreBlueEl, scores.blue]].forEach(([el,v])=>{
    const len=String(v).length;
    if(len>=4) el.style.fontSize='min(22vh,16vw,200px)';
    else el.style.fontSize='';
  });
}
function renderAll(){ renderTimer(); renderScores(); }
function save(){ try{ localStorage.setItem(STORAGE_KEY, JSON.stringify({initialSeconds:totalSeconds,remaining,isRunning,scores,names})); }catch{} }
function load(){ try{ const r=localStorage.getItem(STORAGE_KEY); if(r){ const s=JSON.parse(r); if(s.names)names=s.names; if(s.scores)scores=s.scores; if(TEST_START_SECONDS!==0) remaining=TEST_START_SECONDS; else if(s.remaining!==undefined) remaining=Math.min(s.remaining, totalSeconds); if(s.isRunning!==undefined)isRunning=s.isRunning; } else if(TEST_START_SECONDS!==0) remaining=TEST_START_SECONDS; }catch{} if(TEST_START_SECONDS!==0) remaining=TEST_START_SECONDS; }
function broadcastTick(){ const m={type:'tick',remaining,isRunning}; if(bc)try{bc.postMessage(m)}catch{}; mqttPublish({type:'tick',remaining,isRunning}); try{localStorage.setItem(STORAGE_KEY, JSON.stringify({initialSeconds:totalSeconds,remaining,isRunning,scores,names}))}catch{}; if(window.opener)try{window.opener.postMessage(m,'*')}catch{} }
let countdownAudio=document.getElementById('countdownSound');
let buzzerAudio=document.getElementById('buzzerSound');
let countdownBuffer=null;
let buzzerBuffer=null;
let audioCtx2=null;
try{
  const AC = window.AudioContext||window.webkitAudioContext;
  if(AC) audioCtx2=new AC();
  fetch('sounds/countdown.mp3').then(r=>r.arrayBuffer()).then(b=>audioCtx2.decodeAudioData(b).then(buf=>{countdownBuffer=buf;}).catch(()=>{})).catch(()=>{});
  fetch('sounds/buzzer.mp3').then(r=>r.arrayBuffer()).then(b=>audioCtx2.decodeAudioData(b).then(buf=>{buzzerBuffer=buf;}).catch(()=>{})).catch(()=>{});
}catch{}
function unlockAudio(){
  try{
    if(audioCtx2 && audioCtx2.state==='suspended') audioCtx2.resume();
    for(const a of [countdownAudio, buzzerAudio]){
      if(a) {
        a.muted=true;
        const p=a.play();
        if(p) p.then(()=>{ a.pause(); a.currentTime=0; a.muted=false; }).catch(()=>{ a.muted=false; });
      }
    }
  }catch{}
}
document.addEventListener('click', unlockAudio, {once:true});
document.addEventListener('keydown', unlockAudio, {once:true});
async function playCountdownSound(){
  try{
    let ctx = audioCtx2;
    if(!ctx){
      try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC) ctx=audioCtx2=new AC(); }catch{}
    }
    if(ctx){
      if(ctx.state==='suspended') await ctx.resume().catch(()=>{});
      if(countdownBuffer){
        const src=ctx.createBufferSource();
        src.buffer=countdownBuffer;
        src.connect(ctx.destination);
        src.start();
        return;
      }
    }
    let a = countdownAudio || document.getElementById('countdownSound');
    if(a){
      a.muted=false;
      a.currentTime=0;
      const p=a.play();
      if(p) await p.catch(()=>{});
    }
  }catch(e){ console.log('playCountdownSound error', e); }
}
async function playBuzzerSound(){
  try{
    let ctx = audioCtx2;
    if(!ctx){
      try{ const AC=window.AudioContext||window.webkitAudioContext; if(AC) ctx=audioCtx2=new AC(); }catch{}
    }
    if(ctx){
      if(ctx.state==='suspended') await ctx.resume().catch(()=>{});
      if(buzzerBuffer){
        const src=ctx.createBufferSource();
        src.buffer=buzzerBuffer;
        src.connect(ctx.destination);
        src.start();
        return;
      }
    }
    let a = buzzerAudio || document.getElementById('buzzerSound');
    if(a){
      a.muted=false;
      a.currentTime=0;
      const p=a.play();
      if(p) await p.catch(()=>{});
    }
  }catch(e){ console.log('playBuzzerSound error', e); }
}
function tick(){ if(remaining>=totalSeconds){stop();remaining=totalSeconds;renderTimer();broadcastTick();return} remaining++; renderTimer(); if(remaining===177) playCountdownSound(); if([30,60,120,150].includes(remaining)) playBuzzerSound(); broadcastTick(); if(remaining>=totalSeconds){stop();save();} }
function start(){
  if(isRunning||isCounting) return;
  if(remaining>=totalSeconds) return;
  if(remaining>0){
    // 再開はカウントダウンなし
    isRunning=true;
    if(!timerId) timerId=setInterval(tick,1000);
    save(); broadcastTick();
    return;
  }
  startCountdownSequence();
}
function stop(){ if(timerId)clearInterval(timerId); timerId=null; isRunning=false; clearCountdown(); save(); broadcastTick(); }
function reset(){
  clearCountdown();
  stop();
  remaining=0; scores={red:0,blue:0};
  renderAll();
  showCountdown('READY', false);
  save(); broadcastTick();
}
function setTime(m,s){ remaining=0; isRunning=false; if(timerId)clearInterval(timerId); timerId=null; renderTimer(); save(); broadcastTick(); }
function applyState(s){
  if(s.remaining!==undefined) remaining=Math.min(s.remaining, totalSeconds);
  if(s.isRunning!==undefined){
    if(isCounting){ isRunning=s.isRunning; }
    else {
      if(s.isRunning&&!isRunning){isRunning=true; if(!timerId) timerId=setInterval(tick,1000);}
      else if(!s.isRunning&&isRunning){isRunning=false; if(timerId)clearInterval(timerId); timerId=null;}
      else isRunning=s.isRunning;
    }
  }
  if(s.scores)scores=s.scores; if(s.names)names=s.names; renderAll();
}
if(bc) bc.onmessage=e=>{ const m=e.data; if(!m||!m.type)return; if(m.type==='state'&&m.state)applyState(m.state); else if(m.type==='cmd'){ if(m.action==='start')start(); else if(m.action==='pause')stop(); else if(m.action==='reset')reset(); else if(m.action==='setTime')setTime(Math.floor((m.initialSeconds||0)/60),(m.initialSeconds||0)%60); else if(m.action==='fullscreen')boardWrap.requestFullscreen?.(); } };
window.addEventListener('message',e=>{ const m=e.data; if(!m||!m.type)return; if(m.type==='state'&&m.state)applyState(m.state); else if(m.type==='cmd'){ if(m.action==='start')start(); else if(m.action==='pause')stop(); else if(m.action==='reset')reset(); else if(m.action==='setTime')setTime(Math.floor((m.initialSeconds||0)/60),(m.initialSeconds||0)%60); else if(m.action==='fullscreen')boardWrap.requestFullscreen?.(); } });
window.addEventListener('storage',e=>{ if(e.key===STORAGE_KEY&&e.newValue){ try{applyState(JSON.parse(e.newValue))}catch{} } });
document.addEventListener('keydown',e=>{ if(e.key.toLowerCase()==='f'){ if(!document.fullscreenElement)boardWrap.requestFullscreen?.(); else document.exitFullscreen?.(); } });
boardWrap.addEventListener('dblclick',()=>{ if(!document.fullscreenElement)boardWrap.requestFullscreen?.(); else document.exitFullscreen?.(); });
function showHint(){ hintEl.style.opacity='1'; setTimeout(()=>hintEl.style.opacity='0',2500); }
setTimeout(showHint,600);
load(); renderAll();
if(!isRunning && remaining===0) showCountdown('READY', false);
if(isRunning) timerId=setInterval(tick,1000);
setTimeout(()=>{ const m={type:'display-ready'}; if(bc)try{bc.postMessage(m)}catch{}; if(window.opener)try{window.opener.postMessage(m,'*')}catch{} mqttPublish({type:'display-ready'}); },300);
mqttInit();
</script>
</body>
</html>
