  :root {
    --red: #e30613;
    --blue: #0081ff;
    --digit: #fff;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: #0a0a0a;
    color: #fff;
    font-family: "Noto Sans JP", sans-serif;
    padding: 16px;
    min-height: 100vh;
  }
  h1 {
    text-align: center;
    font-size: 14px;
    letter-spacing: 0.3em;
    opacity: 0.6;
    margin-bottom: 12px;
  }
  .open-display {
    display: flex;
    justify-content: center;
    margin-bottom: 16px;
  }
  .btn-open {
    background: #fff;
    color: #111;
    border: none;
    border-radius: 8px;
    padding: 12px 24px;
    font-weight: 900;
    font-size: 14px;
    cursor: pointer;
  }
  .preview {
    width: 360px;
    max-width: 92vw;
    margin: 0 auto 20px;
    background: #000;
    border: 2px solid #222;
    overflow: hidden;
  }
  .preview .timer-area {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 10px 0;
    border-bottom: 6px solid #000;
  }
  .preview .timer {
    font-family: 'DSEG7-Classic', monospace;
    font-weight: 700;
    font-size: 78px;
    color: var(--digit);
    display: flex;
    justify-content: center;
    align-items: center;
    width: auto;
    letter-spacing: 0;
  }
  .preview #pTimerMin { text-align: center; }
  .preview #pTimerSec { text-align: center; }
  .preview .colon { text-align: center; min-width: 0.3em; margin: 0 0.02em; }
  .preview { position: relative; }
  .preview .countdown-overlay {
    position: absolute;
    inset: 0;
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 5;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s;
  }
  .preview .countdown-overlay.active { opacity: 1; pointer-events: auto; }
  .preview .countdown-text {
    font-family: 'DSEG14-Classic', 'DSEG7-Classic', monospace;
    font-weight: 400;
    font-size: 72px;
    color: #fff;
    letter-spacing: 0.04em;
  }
  .preview .countdown-text.number {
    font-family: 'DSEG7-Classic', monospace;
    font-weight: 700;
    font-size: 84px;
    letter-spacing: 0;
  }
  .preview .timer.warning { color: #ffe600; }
  .preview .timer.finished { color: #ff3b3b; }
  .preview .scores {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0;
  }
  .preview .team {
    display: flex;
    flex-direction: column;
    padding: 10px;
  }
  .preview .team.red { background: var(--red); }
  .preview .team.blue { background: var(--blue); }
  .preview .team-inner-black {
    background: #000;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 8px 4px;
    flex: 1;
  }
  .preview .score {
    font-family: "Noto Sans JP", sans-serif;
    font-weight: 400;
    font-size: 110px;
    color: #fff;
    line-height: 1;
    max-width: 100%;
    overflow: hidden;
    transform: scaleY(1.18);
    transform-origin: center;
    display: inline-block;
  }
  .preview .team-name {
    text-align: center;
    font-size: 14px;
    font-weight: 900;
    padding: 6px 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .controls {
    width: min(560px, 92vw);
    margin: 0 auto;
    background: #1e1e1e;
    border: 1px solid #333;
    border-radius: 12px;
    padding: 18px;
    box-shadow: 0 8px 24px rgba(0,0,0,0.4);
  }
  .controls h2 { font-size: 13px; letter-spacing: 0.2em; opacity: 0.6; margin-bottom: 14px; text-align: center; }
  .control-row { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; margin-bottom: 14px; }
  .btn { appearance: none; border: none; border-radius: 8px; padding: 10px 16px; font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: 14px; cursor: pointer; display: inline-flex; align-items: center; gap: 6px; }
  .btn:active { transform: scale(0.97); }
  .btn-primary { background: #fff; color: #111; }
  .btn-dark { background: #2a2a2a; color: #fff; border: 1px solid #3a3a3a; }
  .btn-red { background: var(--red); color: #fff; }
  .btn-blue { background: var(--blue); color: #fff; }
  .btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .score-controls { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin-bottom: 14px; }
  .team-control { background: #111; border-radius: 10px; padding: 12px; border: 1px solid #2a2a2a; text-align: center; }
  .team-control.red { border-color: rgba(227,6,19,0.4); }
  .team-control.blue { border-color: rgba(0,129,255,0.4); }
  .team-control-label { font-size: 12px; font-weight: 700; letter-spacing: 0.15em; opacity: 0.7; margin-bottom: 8px; display: flex; align-items: center; justify-content: center; gap: 6px; }
  .dot { width: 10px; height: 10px; border-radius: 50%; display: inline-block; }
  .dot.red { background: var(--red); } .dot.blue { background: var(--blue); }
  .team-control .score-btns { display: flex; gap: 6px; justify-content: center; }
  .team-control .score-btns .btn { flex: 1; justify-content: center; padding: 10px 0; font-size: 18px; }
  .team-input { width: 100%; background: #0a0a0a; border: 1px solid #333; border-radius: 6px; color: #fff; text-align: center; padding: 6px; font-family: "Noto Sans JP", sans-serif; font-weight: 700; font-size: 14px; margin-top: 8px; }
  .timer-setup { display: flex; gap: 8px; justify-content: center; align-items: center; flex-wrap: wrap; margin-bottom: 12px; font-size: 13px; opacity: 0.9; }
  .timer-setup input { width: 70px; background: #0a0a0a; border: 1px solid #333; border-radius: 6px; color: #fff; text-align: center; padding: 6px; font-family: "Share Tech Mono", monospace; font-size: 16px; }
  .preset-row { display: flex; gap: 6px; justify-content: center; flex-wrap: wrap; margin-bottom: 8px; }
  .preset-btn { font-size: 12px; padding: 6px 10px; background: #2a2a2a; color: #aaa; border: 1px solid #333; border-radius: 100px; cursor: pointer; }
  .preset-btn:hover { color: #fff; border-color: #555; }
  .hint { text-align: center; font-size: 11px; opacity: 0.35; margin-top: 14px; line-height: 1.6; }
  .status { text-align: center; font-size: 11px; opacity: 0.6; margin-bottom: 12px; }
  .status .dot-live { display:inline-block; width:8px; height:8px; border-radius:50%; background:#0f0; margin-right:6px; animation: pulse 1.5s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
</style>
</head>
<body>
  <h1>CONTROLLER</h1>
  <div class="open-display">
    <button class="btn-open" id="btnOpenDisplay">⛶ 表示画面を開く（別ウィンドウ）</button>
  </div>
  <div class="status"><span class="dot-live"></span><span id="statusText">表示画面を待機中...</span></div>

  <!-- プレビュー -->
  <div class="preview" id="preview">
    <div class="timer-area">
      <div class="timer"><span id="pTimerMin">0</span><span class="colon">:</span><span id="pTimerSec">00</span></div>
    </div>
    <div id="previewCountdown" class="countdown-overlay"><div id="previewCountdownText" class="countdown-text"></div></div>
    <div class="scores">
      <div class="team red">
        <div class="team-inner-black"><div class="score" id="pScoreRed">0</div></div>
        <div class="team-name" id="pNameRed">チームA</div>
      </div>
      <div class="team blue">
        <div class="team-inner-black"><div class="score" id="pScoreBlue">0</div></div>
        <div class="team-name" id="pNameBlue">チームB</div>
      </div>
    </div>
  </div>
  <audio id="countdownSound" src="sounds/countdown.mp3" preload="auto"></audio>

  <div class="controls">
    <h2>コントロール</h2>
    <div class="control-row">
      <button class="btn btn-primary" id="btnStart">▶ スタート</button>
      <button class="btn btn-dark" id="btnPause" disabled>⏸ 一時停止</button>
      <button class="btn btn-dark" id="btnReset">↺ リセット</button>
    </div>
    <div class="score-controls">
      <div class="team-control red">
        <div class="team-control-label"><span class="dot red"></span> RED / チームA</div>
        <div class="score-btns">
          <button class="btn btn-dark" data-team="red" data-delta="-1">-1</button>
          <button class="btn btn-dark" data-team="red" data-delta="-5">-5</button>
          <button class="btn btn-dark" data-team="red" data-delta="-20">-20</button>
          <button class="btn btn-dark" data-team="red" data-delta="-100">-100</button>
        </div>
        <div class="score-btns" style="margin-top:6px;">
          <button class="btn btn-red" data-team="red" data-delta="1">+1</button>
          <button class="btn btn-red" data-team="red" data-delta="5">+5</button>
          <button class="btn btn-red" data-team="red" data-delta="20">+20</button>
          <button class="btn btn-red" data-team="red" data-delta="100">+100</button>
        </div>
        <input class="team-input" id="inputNameRed" value="チームA" maxlength="12" placeholder="チーム名">
      </div>
      <div class="team-control blue">
        <div class="team-control-label"><span class="dot blue"></span> BLUE / チームB</div>
        <div class="score-btns">
          <button class="btn btn-dark" data-team="blue" data-delta="-1">-1</button>
          <button class="btn btn-dark" data-team="blue" data-delta="-5">-5</button>
          <button class="btn btn-dark" data-team="blue" data-delta="-20">-20</button>
          <button class="btn btn-dark" data-team="blue" data-delta="-100">-100</button>
        </div>
        <div class="score-btns" style="margin-top:6px;">
          <button class="btn btn-blue" data-team="blue" data-delta="1">+1</button>
          <button class="btn btn-blue" data-team="blue" data-delta="5">+5</button>
          <button class="btn btn-blue" data-team="blue" data-delta="20">+20</button>
          <button class="btn btn-blue" data-team="blue" data-delta="100">+100</button>
        </div>
        <input class="team-input" id="inputNameBlue" value="チームB" maxlength="12" placeholder="チーム名">
      </div>
    </div>
    <div class="control-row">
      <button class="btn btn-dark" id="btnSwap">⇄ 入れ替え</button>
      <button class="btn btn-dark" id="btnZeroBoth">両チーム 0点に戻す</button>
    </div>
    <div class="hint">
      スペース: 開始/停止 | R: リセット
    </div>
  </div>

<script>
const STORAGE_KEY = 'scoreboard-state-v2';
// テスト用: 何秒から始めるか
const TEST_START_SECONDS = 0;
const CHANNEL_NAME = 'scoreboard';

// Elements - preview
const pMin = document.getElementById('pTimerMin');
const pSec = document.getElementById('pTimerSec');
const pRed = document.getElementById('pScoreRed');
const pBlue = document.getElementById('pScoreBlue');
const pNameRed = document.getElementById('pNameRed');
const pNameBlue = document.getElementById('pNameBlue');
const previewCountdown = document.getElementById('previewCountdown');
const previewCountdownText = document.getElementById('previewCountdownText');
// Controls
const inputNameRed = document.getElementById('inputNameRed');
const inputNameBlue = document.getElementById('inputNameBlue');
const btnStart = document.getElementById('btnStart');
const btnPause = document.getElementById('btnPause');
const btnReset = document.getElementById('btnReset');
const btnOpenDisplay = document.getElementById('btnOpenDisplay');
const statusText = document.getElementById('statusText');

let displayWin = null;
let bc = null;
try { bc = new BroadcastChannel(CHANNEL_NAME); } catch(e) { bc = null; }

let lastCountdownPlay=-1;
let state = {
  initialSeconds: 3*60,
  remaining: TEST_START_SECONDS,
  isRunning: false,
  scores: { red: 0, blue: 0 },
  names: { red: "チームA", blue: "チームB" }
};

function loadState() {
  try {
    const raw = localStorage.getItem(STORAGE_KEY);
    if (raw) {
      const s = JSON.parse(raw);
      state.initialSeconds = 180;
      if (TEST_START_SECONDS!==0) state.remaining = TEST_START_SECONDS;
      else if (s.remaining !== undefined) state.remaining = Math.min(s.remaining, 180);
      else state.remaining = 0;
      state.isRunning = s.isRunning ?? false;
      state.scores = s.scores ?? state.scores;
      state.names = s.names ?? state.names;
    } else if(TEST_START_SECONDS!==0) state.remaining = TEST_START_SECONDS;
  } catch {}
  if(TEST_START_SECONDS!==0) state.remaining = TEST_START_SECONDS;
}
function saveState() {
  try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
  const msg = { type: 'state', state };
  if (bc) try { bc.postMessage(msg); } catch {}
  if (displayWin && !displayWin.closed) {
    try { displayWin.postMessage(msg, '*'); } catch {}
  }
}
function broadcastCmd(action, payload={}) {
  const msg = { type: 'cmd', action, ...payload };
  if (bc) try { bc.postMessage(msg); } catch {}
  if (displayWin && !displayWin.closed) try { displayWin.postMessage(msg, '*'); } catch {}
}

function formatTimer(sec) {
  const m = Math.floor(sec/60);
  const s = sec%60;
  return { m: String(m), s: String(s).padStart(2,'0') };
}
function showPreviewCountdown(text, isNumber){
  if(!previewCountdown) return;
  previewCountdownText.textContent=text;
  previewCountdownText.className=isNumber?'countdown-text number':'countdown-text';
  previewCountdown.classList.add('active');
}
function hidePreviewCountdown(){
  if(!previewCountdown) return;
  previewCountdown.classList.remove('active');
}
function renderPreview() {
  const { m, s } = formatTimer(state.remaining);
  pMin.textContent = m;
  pSec.textContent = s;
  pRed.textContent = state.scores.red;
  pBlue.textContent = state.scores.blue;
  pNameRed.textContent = state.names.red || 'RED';
  pNameBlue.textContent = state.names.blue || 'BLUE';
  inputNameRed.value = state.names.red;
  inputNameBlue.value = state.names.blue;
  btnStart.disabled = state.isRunning;
  btnPause.disabled = !state.isRunning;
  [[pRed, state.scores.red],[pBlue, state.scores.blue]].forEach(([el,v])=>{
    const len=String(v).length;
    if(len>=4) el.style.fontSize='44px';
    else if(len===3) el.style.fontSize='58px';
    else if(len===2) el.style.fontSize='78px';
    else el.style.fontSize='110px';
  });
  const pt=document.querySelector('.preview .timer');
  if(pt){
    pt.classList.remove('warning','finished');
    if(state.remaining>=177 && state.remaining<=179) pt.classList.add('warning');
    else if(state.remaining>=180) pt.classList.add('finished');
  }
}
function renderAndSave() {
  renderPreview();
  saveState();
}

// Controls
btnStart.addEventListener('click', ()=>{
  // 一時停止からの再開はカウントダウンなし、0からのみカウントダウン（表示側が担当）
  broadcastCmd('start');
  // UIは表示側からのcountdown/tickで更新される
});
btnPause.addEventListener('click', ()=>{
  broadcastCmd('pause');
});
btnReset.addEventListener('click', ()=>{
  state.scores.red=0; state.scores.blue=0;
  state.remaining=TEST_START_SECONDS; state.isRunning=false;
  renderAndSave();
  showPreviewCountdown('READY', false);
  broadcastCmd('reset');
});
// Scores
document.querySelectorAll('[data-team][data-delta]').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    const team=btn.dataset.team;
    const d=parseInt(btn.dataset.delta,10);
    state.scores[team]=Math.max(0, Math.min(9999, state.scores[team]+d));
    renderAndSave();
  });
});
document.getElementById('btnZeroBoth').addEventListener('click', ()=>{ state.scores.red=0; state.scores.blue=0; renderAndSave(); });
document.getElementById('btnSwap').addEventListener('click', ()=>{
  const ts=state.scores.red; state.scores.red=state.scores.blue; state.scores.blue=ts;
  const tn=state.names.red; state.names.red=state.names.blue; state.names.blue=tn;
  renderAndSave();
});
inputNameRed.addEventListener('input', ()=>{ state.names.red=inputNameRed.value; renderAndSave(); });
inputNameBlue.addEventListener('input', ()=>{ state.names.blue=inputNameBlue.value; renderAndSave(); });

btnOpenDisplay.addEventListener('click', ()=>{
  displayWin = window.open('index.html', 'scoreboard-display');
  statusText.textContent = '表示画面を開きました。別モニタに移動してください。';
  setTimeout(()=> saveState(), 500);
});

// Listen from display
if (bc) {
  bc.onmessage = (e)=>{
    const msg=e.data;
    if (!msg || !msg.type) return;
    if (msg.type==='tick') {
      state.remaining = msg.remaining;
      state.isRunning = msg.isRunning;
      renderPreview();
      if(state.remaining===0 && !state.isRunning) showPreviewCountdown('READY', false);
      else hidePreviewCountdown();
      try { localStorage.setItem(STORAGE_KEY, JSON.stringify(state)); } catch {}
      statusText.textContent = `表示画面と同期中... ${formatTimer(state.remaining).m}:${formatTimer(state.remaining).s} ${state.isRunning?'●進行中':'○停止中'}`;
    } else if (msg.type==='countdown') {
      if(msg.hide) hidePreviewCountdown();
      else { showPreviewCountdown(msg.text, msg.isNumber); if(msg.text==='3') playCountdownSound(); }
    } else if (msg.type==='display-ready') {
      saveState();
      statusText.textContent = '表示画面と接続しました';
    } else if (msg.type==='state') {
      // 同期
      if(msg.state.scores) state.scores=msg.state.scores;
      if(msg.state.names) state.names=msg.state.names;
      if(msg.state.remaining!==undefined) state.remaining=msg.state.remaining;
      if(msg.state.isRunning!==undefined) state.isRunning=msg.state.isRunning;
      renderPreview();
    }
  };
}
window.addEventListener('message', (e)=>{
  const msg=e.data;
  if (!msg || !msg.type) return;
  if (msg.type==='tick') {
      state.remaining = msg.remaining;
      state.isRunning = msg.isRunning;
      renderPreview();
      if(state.remaining===0 && !state.isRunning) showPreviewCountdown('READY', false);
      else hidePreviewCountdown();
  } else if (msg.type==='countdown') {
    if(msg.hide) hidePreviewCountdown();
    else { showPreviewCountdown(msg.text, msg.isNumber); if(msg.text==='3') playCountdownSound(); }
  } else if (msg.type==='display-ready') {
    saveState();
  } else if (msg.type==='state' && msg.state) {
    if(msg.state.scores) state.scores=msg.state.scores;
    if(msg.state.names) state.names=msg.state.names;
    if(msg.state.remaining!==undefined) state.remaining=msg.state.remaining;
    if(msg.state.isRunning!==undefined) state.isRunning=msg.state.isRunning;
    renderPreview();
  }
});
window.addEventListener('storage', (e)=>{
  if (e.key===STORAGE_KEY && e.newValue) {
    try {
      const s=JSON.parse(e.newValue);
      if (s.remaining!==undefined) {
        state.remaining = s.remaining;
        state.isRunning = s.isRunning;
        state.scores = s.scores || state.scores;
        state.names = s.names || state.names;
        renderPreview();
      }
    } catch {}
  }
});

// Keyboard shortcuts
document.addEventListener('keydown', (e)=>{
  if (e.target.tagName==='INPUT') return;
  if (e.code==='Space') { e.preventDefault(); if(state.isRunning) btnPause.click(); else btnStart.click(); }
  if (e.key.toLowerCase()==='r') btnReset.click();

});

// Init
loadState();
renderPreview();
if(!state.isRunning && state.remaining===0) showPreviewCountdown('READY', false);
saveState();
setInterval(()=>{
  if (displayWin && displayWin.closed) {
    statusText.textContent = '表示画面が閉じられました';
  }
}, 2000);
</script>
</body>
</html>
